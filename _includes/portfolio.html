{% include i18n.html %}
<section class="portfolio" id="work">
  <div class="section__head">
    <h2>{{ t.gallery.title }}</h2>
    <p>{{ t.gallery.intro }}</p>
  </div>

  <div class="masonry">
    {% for item in site.data.gallery %}
    <figure class="tile{% if item.accent %} tile--accent{% endif %}" style="height: {{ item.height }}px;{% if item.image != "" %} background-image:url('{{ item.image | relative_url }}');{% endif %}">
      <figcaption>
        <span class="tile__title">{% include tr.html obj=item key="title" %}</span>
        <span class="tile__category">{% include tr.html obj=item key="category" %}</span>
      </figcaption>
    </figure>
    {% endfor %}
  </div>
</section>
