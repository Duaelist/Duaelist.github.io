<header class="nav">
  <a class="nav__mark" href="{{ '/' | relative_url }}">{{ site.title }}</a>

  <nav class="nav__links" aria-label="Contact and social links">
    <a class="nav__email" href="mailto:{{ site.email }}">{{ site.email }}</a>
    <span class="nav__divider" aria-hidden="true"></span>
    <ul class="nav__social">
      {% if site.social.linkedin %}<li><a href="{{ site.social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a></li>{% endif %}
      {% if site.social.artstation %}<li><a href="{{ site.social.artstation }}" target="_blank" rel="noopener">ArtStation</a></li>{% endif %}
      {% if site.social.instagram %}<li><a href="{{ site.social.instagram }}" target="_blank" rel="noopener">Instagram</a></li>{% endif %}
    </ul>
  </nav>
</header>
