<section class="hero">
  <div class="hero__text">
    <h1>{{ site.title }}</h1>
    <p class="hero__role">{{ site.tagline }}</p>
    <p class="hero__meta">PM Enviroment Art VFX and QA</p>
    <div class="hero__actions">
      <a class="btn btn--primary" href="mailto:{{ site.email }}">{{ site.cta_label }}</a>
      <a class="btn btn--ghost" href="#work">View the work</a>
    </div>
  </div>

  <div class="hero__viewport">
    <img src="{{ '/assets/img/work/sp1.gif' | relative_url }}" alt="Featured render">
    <p class="Creating Fun games</p>
  </div>
</section>
