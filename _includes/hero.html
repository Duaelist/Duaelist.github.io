{% include i18n.html %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap">
<section class="hero" id="about">
  <div class="hero__text">
    <h1>{{ site.title }}</h1>
    <p class="hero__role">{{ t.tagline | default: site.tagline }}</p>
    <p class="hero__meta">{{ t.hero.meta }}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" href="mailto:{{ site.email }}">{{ t.cta_label | default: site.cta_label }}</a>
      <a class="btn btn--ghost" href="#work">{{ t.hero.view_work }}</a>
    </div>
  </div>

  <div class="hero__viewport">
    <p class="puzzle__title" id="puzzle-title">{{ t.hero.puzzle_title }}</p>
    <div class="puzzle" id="untangle" data-lang="{{ page.lang | default: site.lang }}">
      <canvas class="puzzle__canvas" role="img"></canvas>
      <div class="puzzle__win" role="status" hidden>
        <p class="puzzle__win-title"></p>
        <p class="puzzle__win-moves"></p>
        <button type="button" class="btn btn--primary puzzle__again"></button>
      </div>
    </div>
    <div class="puzzle__bar">
      <span class="puzzle__status"></span>
      <button type="button" class="btn btn--ghost puzzle__reset"></button>
    </div>
    <p class="puzzle__hint"></p>
  </div>
</section>

<style>
  .hero__viewport { --puzzle-font: "Space Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .puzzle__title { font-family: var(--puzzle-font); max-width: 440px; margin: 0 auto .75rem; text-align: center; font-size: 1.15rem; font-weight: 700; line-height: 1.3; text-wrap: balance; }
  .puzzle { container-type: inline-size; position: relative; width: 100%; max-width: 440px; margin-inline: auto; background: #182440; border-radius: 18px; overflow: hidden; }
  .puzzle__canvas { display: block; width: 100%; aspect-ratio: 1 / 1; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .puzzle__win { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: .4rem; padding: 1rem; text-align: center; color: #fff; background: rgba(24, 36, 64, .9); }
  .puzzle__win[hidden] { display: none; }
  .puzzle__win-title { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: .05em .3em; font-size: 2rem; font-size: clamp(1.4rem, 8cqw, 2.6rem); font-family: var(--puzzle-font); font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
  .puzzle__chunk { display: inline-block; }
  .puzzle__chunk--lead { flex-basis: 100%; font-size: 1.5em; }
  .puzzle__chunk--accent { color: #4ADE80; }
  .puzzle__win-moves { margin: .5rem 0 .4rem; color: rgba(255, 255, 255, .8); }
  .puzzle__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Win animation: the dim fades in, all the text pops in together, then the moves + button rise in. */
  .puzzle__win.is-playing { animation: puzzle-dim .3s ease-out backwards; }
  .puzzle__win.is-playing .puzzle__chunk { animation: puzzle-pop .45s ease-out backwards; }
  .puzzle__win.is-playing .puzzle__win-moves,
  .puzzle__win.is-playing .puzzle__again { animation: puzzle-rise .35s ease-out .65s backwards; }
  @keyframes puzzle-dim { from { background: rgba(24, 36, 64, 0); } }
  @keyframes puzzle-pop {
    0%   { opacity: 0; transform: scale(1); }
    40%  { opacity: 1; transform: scale(1.3); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes puzzle-rise { from { opacity: 0; transform: translateY(8px); visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .puzzle__win.is-playing,
    .puzzle__win.is-playing .puzzle__chunk,
    .puzzle__win.is-playing .puzzle__win-moves,
    .puzzle__win.is-playing .puzzle__again { animation: none; }
  }
  .puzzle__bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; width: 100%; max-width: 440px; margin: .75rem auto 0; font-size: .85rem; }
  .puzzle__status { opacity: .8; }
  .puzzle__reset { padding: .4rem .9rem; font-size: .85rem; }
  .puzzle__hint { max-width: 440px; margin: .75rem auto 0; text-align: center; font-family: var(--font-mono); font-size: .75rem; color: var(--fg-muted); }
</style>

{% raw %}
<script>
(function () {
  'use strict';
  var root = document.getElementById('untangle');
  if (!root) return;

  var canvas = root.querySelector('.puzzle__canvas');
  var winBox = root.querySelector('.puzzle__win');
  var winTitle = root.querySelector('.puzzle__win-title');
  var winMoves = root.querySelector('.puzzle__win-moves');
  var againBtn = root.querySelector('.puzzle__again');
  var scope = root.parentNode;
  var statusEl = scope.querySelector('.puzzle__status');
  var resetBtn = scope.querySelector('.puzzle__reset');
  var hintEl = scope.querySelector('.puzzle__hint');
  var ctx = canvas.getContext('2d');

  var lang = (root.getAttribute('data-lang') || document.documentElement.lang || 'en').toLowerCase();
  var ES = lang.indexOf('es') === 0;
  var T = ES ? {
    hint: 'Arrastra los puntos por los rieles hasta que ninguna línea se cruce.',
    aria: 'Rompecabezas: arrastra los puntos por los rieles hasta que ninguna línea se cruce.',
    crossing: 'Líneas cruzadas', reset: 'Reiniciar nivel',
    resetTip: 'Vuelve a colocar los puntos como estaban al empezar este nivel',
    chunks: ['¡Exacto!', 'Videojuegos.'], winFull: '¡Exacto! Videojuegos.',
    move: 'movimiento', moves: 'movimientos',
    next: 'Siguiente nivel', replay: 'Jugar de nuevo'
  } : {
    hint: 'Drag the points along the rails until no line crosses another.',
    aria: 'Puzzle: drag the points along the rails until no line crosses another.',
    crossing: 'Lines crossing', reset: 'Restart level',
    resetTip: 'Put the dots back where they started in this level',
    chunks: ['Exactly!', 'Videogames.'], winFull: 'Exactly! Videogames.',
    move: 'move', moves: 'moves',
    next: 'Next puzzle', replay: 'Play again'
  };

  // ---- Board constants (same numbers as the Unity project) ----
  var COLS = 3, ROWS = 3;  // grid size (set by each level)
  var SP = 1.8;            // distance between intersections (set by each level)
  var RAIL = 0.5;          // rail thickness (set by each level)
  var MINSEP = 0.85;       // minPointSeparation
  var STEP = 0.02;         // stepSize
  var MAXTRAVEL = 4;       // maxTravelPerFrame
  var RADIUS = 0.35;       // point radius (scale 0.7)
  var LINEW = 0.14;        // lineWidth
  var EP = 0.02;           // endpointTolerance
  var OV = 0.12;           // overlapTolerance
  var HIT = 0.6;           // grab radius, a little generous for touch
  var WORLD = 3.1;         // half-size of the visible world square

  var COL = {
    rail: '#253A5C', cell: '#324F7D', line: '#4ADE80', cross: '#E83D3D',
    point: '#FFFFFF', drag: '#FFEB8C'
  };

  // Each level sets its own grid, dot start positions [col,row] and the lines joining
  // them (pairs of dot indexes). Every level is verified solvable; "min" is a proven
  // lower bound on the moves a perfect player needs.
  var LINES = [];
  var LEVELS = [
    // Level 1: 3x3 grid, 5 dots, 5 lines, min 3 moves
    { cols: 3, rows: 3, sp: 1.8, rail: 0.5,
      pts: [[0,0],[1,1],[0,2],[1,0],[2,0]],
      lines: [[4,2],[2,3],[4,0],[0,1],[1,2]] },
    // Level 2: 3x3 grid, 5 dots, 5 lines, min 4 moves
    { cols: 3, rows: 3, sp: 1.8, rail: 0.5,
      pts: [[0,0],[1,2],[0,2],[1,0],[2,2]],
      lines: [[4,2],[2,3],[4,0],[0,1],[1,2]] },
    // Level 3: 3x3 grid, 5 dots, 5 lines, min 5 moves
    { cols: 3, rows: 3, sp: 1.8, rail: 0.5,
      pts: [[0,0],[1,2],[0,2],[2,0],[2,2]],
      lines: [[4,2],[2,3],[4,0],[0,1],[1,2]] },
    // Level 4: 3x3 grid, 6 dots, 9 lines, min 6 moves
    { cols: 3, rows: 3, sp: 1.8, rail: 0.5,
      pts: [[1,0],[2,0],[2,2],[1,2],[1,1],[2,1]],
      lines: [[0,2],[3,5],[1,2],[0,5],[0,4],[2,5],[1,3],[0,3],[2,4]] },
    // Level 5: 3x3 grid, 6 dots, 10 lines, min 8 moves
    { cols: 3, rows: 3, sp: 1.8, rail: 0.5,
      pts: [[0,0],[2,0],[0,2],[0,1],[1,1],[1,0]],
      lines: [[0,2],[2,5],[1,2],[3,4],[0,3],[0,1],[0,5],[0,4],[2,3],[1,3]] },
    // Level 6: 4x4 grid, 7 dots, 11 lines, min 6 moves
    { cols: 4, rows: 4, sp: 1.2, rail: 0.4,
      pts: [[3,1],[2,2],[0,2],[2,1],[0,1],[3,3],[3,0]],
      lines: [[0,1],[3,5],[1,4],[5,6],[0,6],[2,6],[0,4],[0,5],[1,6],[3,6],[2,3]] },
    // Level 7: 4x4 grid, 7 dots, 13 lines, min 7 moves
    { cols: 4, rows: 4, sp: 1.2, rail: 0.4,
      pts: [[3,2],[3,3],[2,0],[2,1],[1,1],[0,3],[1,2]],
      lines: [[0,4],[0,5],[0,2],[0,3],[1,6],[1,4],[3,5],[2,4],[2,5],[2,3],[4,5],[4,6],[2,6]] },
    // Level 8: 4x4 grid, 8 dots, 14 lines, min 7 moves
    { cols: 4, rows: 4, sp: 1.2, rail: 0.4,
      pts: [[0,3],[3,1],[0,2],[3,2],[1,3],[1,0],[2,3],[1,1]],
      lines: [[0,5],[1,7],[1,6],[0,2],[2,7],[2,4],[3,5],[1,2],[0,1],[0,4],[1,5],[6,7],[1,4],[0,3]] },
    // Level 9: 4x4 grid, 8 dots, 16 lines, min 8 moves
    { cols: 4, rows: 4, sp: 1.2, rail: 0.4,
      pts: [[0,1],[0,3],[1,3],[3,0],[1,1],[0,0],[3,3],[2,3]],
      lines: [[0,6],[4,7],[2,6],[3,4],[1,5],[4,5],[0,4],[0,2],[5,7],[1,4],[2,4],[1,3],[3,5],[2,7],[6,7],[1,7]] },
    // Level 10: 4x4 grid, 9 dots, 17 lines, min 9 moves
    { cols: 4, rows: 4, sp: 1.2, rail: 0.4,
      pts: [[2,2],[1,1],[3,3],[1,0],[3,1],[2,1],[0,3],[0,1],[2,0]],
      lines: [[1,6],[2,5],[2,3],[5,6],[4,6],[4,8],[2,7],[0,7],[3,8],[0,2],[3,7],[3,5],[1,5],[1,2],[7,8],[5,8],[4,5]] }
  ];

  var level = 0, points = [], moves = 0, complete = false;
  var drag = null, dragStart = null, crossing = {}, crossCount = 0, hover = false;

  // ---- Geometry ----
  function nodePos(c, r) {
    return { x: (c - (COLS - 1) / 2) * SP, y: (r - (ROWS - 1) / 2) * SP };
  }
  function dist(a, b) { return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }
  function onNode(p) { return p.a.c === p.b.c && p.a.r === p.b.r; }
  function railPos(p) {
    var a = nodePos(p.a.c, p.a.r);
    if (onNode(p)) return a;
    var b = nodePos(p.b.c, p.b.r), t = p.d / SP;
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  }
  function validNode(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }

  // ---- Rail sliding (port of PuzzlePoint) ----
  var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function blocked(mover, cand, cur) {
    for (var i = 0; i < points.length; i++) {
      var o = points[i];
      if (o === mover) continue;
      var op = railPos(o);
      var nd = dist(cand, op);
      if (nd >= MINSEP) continue;
      if (nd < dist(cur, op)) return true;
    }
    return false;
  }
  function pickRail(node, tx, ty) {
    var len = Math.sqrt(tx * tx + ty * ty), best = null, bestAlign = 0.0001;
    for (var i = 0; i < DIRS.length; i++) {
      var nc = node.c + DIRS[i][0], nr = node.r + DIRS[i][1];
      if (!validNode(nc, nr)) continue;
      var align = (tx / len) * DIRS[i][0] + (ty / len) * DIRS[i][1];
      if (align > bestAlign) { bestAlign = align; best = { c: nc, r: nr }; }
    }
    return best;
  }
  function commit(p, from, to, cand) {
    var travelled = dist(nodePos(from.c, from.r), cand);
    if (travelled >= SP - 0.0001) { p.a = { c: to.c, r: to.r }; p.b = { c: to.c, r: to.r }; p.d = 0; }
    else if (travelled <= 0.0001) { p.a = { c: from.c, r: from.r }; p.b = { c: from.c, r: from.r }; p.d = 0; }
    else { p.a = { c: from.c, r: from.r }; p.b = { c: to.c, r: to.r }; p.d = travelled; }
  }
  function tryStep(p, target) {
    var cur = railPos(p), tx = target.x - cur.x, ty = target.y - cur.y;
    if (tx * tx + ty * ty < STEP * STEP) return false;
    var from, to;
    if (onNode(p)) {
      to = pickRail(p.a, tx, ty);
      if (!to) return false;
      from = p.a;
    } else {
      var dx = p.b.c - p.a.c, dy = p.b.r - p.a.r, len = Math.sqrt(dx * dx + dy * dy);
      var along = (tx * dx + ty * dy) / len;
      if (Math.abs(along) < 0.0001) return false;
      if (along > 0) { from = p.a; to = p.b; } else { from = p.b; to = p.a; }
    }
    var ddx = to.c - from.c, ddy = to.r - from.r, n = Math.sqrt(ddx * ddx + ddy * ddy);
    var cand = { x: cur.x + (ddx / n) * STEP, y: cur.y + (ddy / n) * STEP };
    if (blocked(p, cand, cur)) return false;
    commit(p, from, to, cand);
    return true;
  }
  function slide(p, target) {
    var budget = Math.ceil(MAXTRAVEL / STEP);
    while (budget-- > 0 && tryStep(p, target)) { }
  }

  // ---- Crossing test (port of ConnectionManager) ----
  function perp(a, b, p) {
    var abx = b.x - a.x, aby = b.y - a.y, len = Math.sqrt(abx * abx + aby * aby);
    if (len < 0.0001) return dist(p, a);
    return (abx * (p.y - a.y) - aby * (p.x - a.x)) / len;
  }
  function within(a, b, p, tol) {
    var abx = b.x - a.x, aby = b.y - a.y, l2 = abx * abx + aby * aby;
    if (l2 < 0.0001) return dist(p, a) <= tol;
    var t = ((p.x - a.x) * abx + (p.y - a.y) * aby) / l2, slack = tol / Math.sqrt(l2);
    return t >= -slack && t <= 1 + slack;
  }
  function sq(a, b) { return (a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y); }
  function overlap(p1, p2, p3, p4) {
    var t = EP * EP, sh = null, ra, rb;
    if (sq(p1, p3) <= t) { sh = p1; ra = p2; rb = p4; }
    else if (sq(p1, p4) <= t) { sh = p1; ra = p2; rb = p3; }
    else if (sq(p2, p3) <= t) { sh = p2; ra = p1; rb = p4; }
    else if (sq(p2, p4) <= t) { sh = p2; ra = p1; rb = p3; }
    if (sh) {
      var da = { x: ra.x - sh.x, y: ra.y - sh.y }, db = { x: rb.x - sh.x, y: rb.y - sh.y };
      var la = Math.sqrt(da.x * da.x + da.y * da.y), lb = Math.sqrt(db.x * db.x + db.y * db.y);
      if (la * la < 0.0001 || lb * lb < 0.0001) return false;
      if ((da.x / la) * (db.x / lb) + (da.y / la) * (db.y / lb) <= 0) return false;
      var near = la <= lb ? ra : rb, far = la <= lb ? rb : ra;
      return Math.abs(perp(sh, far, near)) <= OV;
    }
    var d1 = perp(p3, p4, p1), d2 = perp(p3, p4, p2), d3 = perp(p1, p2, p3), d4 = perp(p1, p2, p4);
    var sA = (d1 > EP && d2 < -EP) || (d1 < -EP && d2 > EP);
    var sB = (d3 > EP && d4 < -EP) || (d3 < -EP && d4 > EP);
    if (sA && sB) return true;
    if (Math.abs(d1) <= OV && within(p3, p4, p1, OV)) return true;
    if (Math.abs(d2) <= OV && within(p3, p4, p2, OV)) return true;
    if (Math.abs(d3) <= OV && within(p1, p2, p3, OV)) return true;
    if (Math.abs(d4) <= OV && within(p1, p2, p4, OV)) return true;
    return false;
  }
  function evaluate() {
    var ps = points.map(railPos), bad = {}, count = 0;
    for (var i = 0; i < LINES.length; i++) {
      for (var j = i + 1; j < LINES.length; j++) {
        if (overlap(ps[LINES[i][0]], ps[LINES[i][1]], ps[LINES[j][0]], ps[LINES[j][1]])) {
          bad[i] = true; bad[j] = true;
        }
      }
    }
    for (var k in bad) if (bad.hasOwnProperty(k)) count++;
    crossing = bad; crossCount = count;
  }

  // ---- UI state ----
  function updateStatus() {
    statusEl.textContent = T.crossing + ': ' + crossCount;
  }
  function showWin() {
    complete = true;
    winTitle.textContent = '';
    var sr = document.createElement('span');
    sr.className = 'puzzle__sr';
    sr.textContent = T.winFull;
    winTitle.appendChild(sr);
    T.chunks.forEach(function (text, i) {
      var c = document.createElement('span');
      c.className = 'puzzle__chunk' + (i === 0 ? ' puzzle__chunk--lead' : '') + (i === T.chunks.length - 1 ? ' puzzle__chunk--accent' : '');
      c.textContent = text;
      c.setAttribute('aria-hidden', 'true');
      winTitle.appendChild(c);
    });
    winMoves.textContent = moves + ' ' + (moves === 1 ? T.move : T.moves);
    againBtn.textContent = level === LEVELS.length - 1 ? T.replay : T.next;
    winBox.classList.remove('is-playing');
    winBox.hidden = false;
    void winBox.offsetWidth;            // restart the animation on every win
    winBox.classList.add('is-playing');
  }
  function loadLevel(i) {
    cancelSnap();
    level = i; moves = 0; complete = false; drag = null; hover = false;
    winBox.hidden = true;
    winBox.classList.remove('is-playing');
    var cfg = LEVELS[i];
    COLS = cfg.cols; ROWS = cfg.rows; SP = cfg.sp; RAIL = cfg.rail; LINES = cfg.lines;
    points = cfg.pts.map(function (n, idx) {
      return { id: idx, a: { c: n[0], r: n[1] }, b: { c: n[0], r: n[1] }, d: 0 };
    });
    evaluate(); updateStatus(); draw();
  }

  // ---- Drawing ----
  function draw() {
    var size = canvas.width, s = size / (2 * WORLD);
    function X(x) { return (x + WORLD) * s; }
    function Y(y) { return (WORLD - y) * s; }
    function box(cx, cy, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(X(cx - w / 2), Y(cy + h / 2), w * s, h * s);
    }
    ctx.clearRect(0, 0, size, size);

    var spanW = (COLS - 1) * SP, spanH = (ROWS - 1) * SP, outerW = spanW + RAIL, outerH = spanH + RAIL;
    box(0, 0, outerW, outerH, COL.cell);
    for (var c = 0; c < COLS; c++) box(nodePos(c, 0).x, 0, RAIL, outerH, COL.rail);
    for (var r = 0; r < ROWS; r++) box(0, nodePos(0, r).y, outerW, RAIL, COL.rail);

    var ps = points.map(railPos);
    ctx.lineCap = 'round'; ctx.lineWidth = LINEW * s;
    for (var i = 0; i < LINES.length; i++) {
      var a = ps[LINES[i][0]], b = ps[LINES[i][1]];
      ctx.strokeStyle = crossing[i] ? COL.cross : COL.line;
      ctx.beginPath(); ctx.moveTo(X(a.x), Y(a.y)); ctx.lineTo(X(b.x), Y(b.y)); ctx.stroke();
    }
    for (var k = 0; k < points.length; k++) {
      if (points[k] === drag) continue;
      dot(ps[k], COL.point);
    }
    if (drag) dot(railPos(drag), COL.drag);
    function dot(p, color) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), RADIUS * s, 0, Math.PI * 2); ctx.fill();
    }
  }
  function resize() {
    var dpr = window.devicePixelRatio || 1, w = canvas.clientWidth || 320;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(w * dpr);
    draw();
  }

  // ---- Input ----
  function worldOf(e) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: ((e.clientX - rect.left) / rect.width) * 2 * WORLD - WORLD,
      y: WORLD - ((e.clientY - rect.top) / rect.height) * 2 * WORLD
    };
  }
  function nearest(w) {
    var best = null, bd = Math.min(HIT, SP / 2);
    for (var i = 0; i < points.length; i++) {
      var d = dist(w, railPos(points[i]));
      if (d <= bd) { bd = d; best = points[i]; }
    }
    return best;
  }
  // ---- Snapping: a point always comes to rest on an intersection ----
  var SNAP_MS = 120;       // length of the snap animation
  var snap = null, snapRaf = 0;
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function occupied(node, mover) {
    for (var i = 0; i < points.length; i++) {
      var o = points[i];
      if (o !== mover && onNode(o) && o.a.c === node.c && o.a.r === node.r) return true;
    }
    return false;
  }
  // Where a point left mid-rail settles: the closer end of its rail, or the
  // other end (the intersection it just came from) if the closer one is taken.
  function snapTarget(p) {
    if (onNode(p)) return null;
    var toB = p.d > SP / 2;
    if (occupied(toB ? p.b : p.a, p)) toB = !toB;
    return { toB: toB, node: toB ? p.b : p.a };
  }
  function settle(s) {
    snap = null;
    s.p.a = { c: s.node.c, r: s.node.r };
    s.p.b = { c: s.node.c, r: s.node.r };
    s.p.d = 0;
    evaluate(); updateStatus(); draw();
