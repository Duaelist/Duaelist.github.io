    Cada programa tenía una función clara:

    - **After Effects:** donde se crearon los diseños y las animaciones.
    - **Resolume Arena:** donde se reproducían y controlaban los visuales. Los clips se organizaban en columnas, y efectos como Contour Glow convertían la imagen de una cámara en vivo en un contorno brillante.
    - **Ableton:** el sonido. Las notas MIDI llevan la música, y un LFO mueve el drive de un saturador al ritmo del tempo, de modo que el sonido pulsa con el beat.
    - **Google Sheets:** el plan detrás de todo, con tareas, fechas límite y assets en un solo lugar.

