  description: |
    Snake Space is a first-person high-risk precision shooter where you play as Dorian, a scientist partially infected by an extra-dimensional snake parasite, still fighting to maintain control. Outnumbered, one advantage is your phase shifting ability, that allows you to scout or move to a better vantage point when things get too threatening.

    **Status:** Released · **Platform:** Windows · Free to download on itch.io

    ### My role

    I was the project manager, and I also made textures and environment art. Doing both was useful on a small team: being close to the art meant I knew how long things really took, so my planning stayed honest and approachable.

    ### How I kept the project organized

    Our challenge was Triple, maintaining the entire team happy and motivated, giving them something they like to do since it was some of the team members first project, adding to that, the fact that we were still learning made it so the timeline had to be adjusted and account for learning time, finally these two combined created the additional challenge of time, since three months become pretty tight actually. We had under three months to make a game that felt good to play, so every week counted. My answer was order, and a lot of sheets. Tasks, deadlines and bugs lived in shared sheets, each with one clear job, so nobody had to ask what to do next or where to look.

    - **One place to look:** everyone worked from the same sheets, so the plan was never in somebody's head, even so, many adjustments could be made on the stand ups.
    - **Bugs with a trail:** bug tracking was part of my job, and a written list made it easy to see what was open, what was fixed and what still blocked us many of them were trackend on the platform JIRA and hack'n plan.
    - **Problems visible early:** when a task slipped, it showed in the sheet that week, while there was still time to move things around.

    Our tools include Google sheets, JIRA and hack'n plan. each platform has its strenghts

    I wrote more about this way of working in my **Managing through Sheets** project.

    ### Challenges and what I learned

    The timeline was only half of the challenge. The other half was the people side: conflicts inside the team and building a team that trusted each other. Putting priorities in writing helped a lot. It also learned to be flexible and trust my team, sometimes we didnt get the desired result but we got something satisfactory or even better and that motivated the team into working more

   

    ### Team

    - **Rodrigo Alberto Galvan Alejandre**: PM, textures, environment artist
    - **Mel Mirahmadi**: Artist, character animations, VFX, UI designer
    - **Martin Navarro**: Level designer, sound designer, QA
    - **Carson Wang**: Programmer, combat designer

    ### External collaborators

    - Maat Ramirez Morales: Concept artist
    - Izak Arida: Music collaborator
    - Jon Hunwick: Concept artist
    - Natalia Casados: Prop artist
    - Natalie Wong: Prop artist
    - Abigail Gravill: Concept artist
    - Juan Destefano: Sound collaborator
    - Wesley Chang: Sound collaborator

    No generative AI was used.
  description_es: |
    Snake Space es un shooter en primera persona de precisión y alto riesgo en el que juegas como Dorian, un científico parcialmente infectado por un parásito serpiente extradimensional que todavía lucha por mantener el control. En clara desventaja numérica, tu mejor ventaja es la habilidad de cambiar de fase, que te permite explorar o moverte a una mejor posición cuando la situación se vuelve demasiado peligrosa.

    **Estado:** Publicado · **Plataforma:** Windows · Descarga gratuita en itch.io

    ### Mi rol

    Fui el project manager y también hice texturas y arte de entornos. Hacer ambas cosas fue útil en un equipo pequeño: estar cerca del arte me permitía saber cuánto tiempo llevaban realmente las cosas, así que mi planeación se mantuvo honesta y cercana al equipo.

    ### Cómo mantuve el proyecto organizado

    Nuestro reto era triple: mantener a todo el equipo contento y motivado, dándole cosas que disfrutara hacer, ya que para algunos integrantes era su primer proyecto; además, como todavía estábamos aprendiendo, el calendario tuvo que ajustarse para incluir tiempo de aprendizaje; y la suma de ambos factores creó un reto adicional, el tiempo, porque tres meses resultan bastante justos. Teníamos menos de tres meses para hacer un juego que se sintiera bien, así que cada semana contaba. Mi respuesta fue el orden, y muchas hojas de cálculo. Tareas, fechas límite y bugs vivían en hojas compartidas, cada una con una función clara, para que nadie tuviera que preguntar qué hacer después ni dónde buscar.

    - **Un solo lugar para consultar:** todos trabajaban con las mismas hojas, así que el plan nunca estaba solo en la cabeza de alguien; aun así, en los stand ups se podían hacer muchos ajustes.
    - **Bugs con historial:** el seguimiento de bugs era parte de mi trabajo, y una lista escrita facilitaba ver qué estaba abierto, qué estaba resuelto y qué seguía bloqueándonos. Muchos se registraron en JIRA y Hack'n Plan.
    - **Problemas visibles a tiempo:** cuando una tarea se retrasaba, se notaba en la hoja esa misma semana, cuando todavía había tiempo de mover cosas.

    Nuestras herramientas incluyeron Google Sheets, JIRA y Hack'n Plan; cada plataforma tiene sus fortalezas.

    Escribí más sobre esta forma de trabajar en mi proyecto **Gestión con hojas de cálculo**.

    ### Retos y lo que aprendí

    El calendario fue solo la mitad del reto. La otra mitad fue el lado humano: los conflictos dentro del equipo y construir un equipo que confiara entre sí. Poner las prioridades por escrito ayudó mucho. También aprendí a ser flexible y a confiar en mi equipo: a veces no conseguíamos el resultado deseado, pero sí algo satisfactorio o incluso mejor, y eso motivaba al equipo a trabajar todavía más.

    ### Equipo

    - **Rodrigo Alberto Galvan Alejandre**: PM, texturas, arte de entornos
    - **Mel Mirahmadi**: Arte, animaciones de personajes, VFX, diseño de UI
    - **Martin Navarro**: Diseño de niveles, diseño de sonido, QA
    - **Carson Wang**: Programación, diseño de combate

    ### Colaboradores externos

    - Maat Ramirez Morales: Arte conceptual
    - Izak Arida: Colaboración musical
    - Jon Hunwick: Arte conceptual
    - Natalia Casados: Arte de props
    - Natalie Wong: Arte de props
    - Abigail Gravill: Arte conceptual
    - Juan Destefano: Colaboración de sonido
    - Wesley Chang: Colaboración de sonido

    No se utilizó IA generativa.
