    ### My role

    I owned everything except the assets: game design, level design, programming and the rest of the work that keeps a prototype moving. With only two people there was nobody else to hand a problem to, so I followed each decision from the first idea to the playable build.

    ### Splitting the work

    Manuel Armando Cabrera Garcia was responsible for the assets, and I took care of everything else. A clear split meant we could work in parallel without waiting on each other.

    The project started from a Blueprint skeleton and a set of props found online by GamedevEnabled, so we could spend our time on the design instead of rebuilding the basics.

