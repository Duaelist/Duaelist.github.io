  description: |
    Snake Space is a first-person, high-risk precision shooter in which you play as Dorian, a scientist partially infected by an extra-dimensional snake parasite who is still fighting to keep control. Outnumbered, your one advantage is your phase-shifting ability, which lets you scout ahead or move to a better vantage point when things get too threatening.

    **Status:** Released · **Platform:** Windows · Free to download on itch.io

    ### My role

    I was the project manager, and I also made textures and environment art. Doing both was useful on a small team: being close to the art meant I knew how long things really took, so my planning stayed honest and approachable.

    ### How I kept the project organized

    We faced three challenges at once. The first was keeping the whole team happy and motivated by giving everyone work they enjoyed, especially since this was the first project for some of them. The second was that we were all still learning, so the timeline had to include time for learning. The third came from the first two: time itself. We had less than three months to make a game that felt good to play, and that is tighter than it sounds, so every week counted.

    My answer was order, and a lot of sheets. Tasks, deadlines and bugs lived in shared sheets, each with one clear job, so nobody had to ask what to do next or where to look.

    - **One place to look:** everyone worked from the same sheets, so the plan was never only in somebody's head. Even so, plenty of adjustments were still made during stand-ups.
    - **Bugs with a trail:** bug tracking was part of my job, and a written list made it easy to see what was open, what was fixed and what was still blocking us. Many bugs were tracked in JIRA and Hack'n Plan.
    - **Problems visible early:** when a task slipped, it showed in the sheet that week, while there was still time to move things around.

    Our tools were Google Sheets, JIRA and Hack'n Plan, and each platform had its own strengths.

    *Placeholder: one line on what each platform was best for (what you used Sheets for, what you used JIRA for, what you used Hack'n Plan for).*

    I wrote more about this way of working in my **Managing through Sheets** project.

    ### Challenges and what I learned

    The timeline was only half of the challenge. The other half was the people side: conflicts inside the team and building a team that trusted each other. Putting priorities in writing helped a lot. I also learned to be flexible and to trust my team. Sometimes we didn't get the result we wanted, but we got something satisfactory or even better, and that motivated the team to work harder.

    ### Team

    - **Rodrigo Alberto Galvan Alejandre**: PM, textures, environment artist
    - **Mel Mirahmadi**: Artist, character animations, VFX, UI designer
    - **Martin Navarro**: Level designer, sound designer, QA
    - **Carson Wang**: Programmer, combat designer

    ### External collaborators

    - Maat Ramirez Morales: Concept artist
    - Izak Arida: Music collaborator
    - Jon Hunwick: Concept artist
    - Natalia Casados: Prop artist
    - Natalie Wong: Prop artist
    - Abigail Gravill: Concept artist
    - Juan Destefano: Sound collaborator
    - Wesley Chang: Sound collaborator

    No generative AI was used.
  description_es: |
    Snake Space es un shooter en primera persona de precisión y alto riesgo en el que juegas como Dorian, un científico parcialmente infectado por un parásito serpiente extradimensional que aún lucha por mantener el control. En clara desventaja numérica, tu mayor ventaja es la habilidad de cambiar de fase, que te permite explorar o moverte a una mejor posición cuando la situación se pone demasiado peligrosa.

    **Estado:** Publicado · **Plataforma:** Windows · Descarga gratuita en itch.io

    ### Mi rol

    Fui el project manager y también hice texturas y arte de entornos. Hacer ambas cosas fue útil en un equipo pequeño: estar cerca del arte me permitía saber cuánto tiempo llevaban realmente las cosas, así que mi planeación se mantuvo honesta y cercana al equipo.

    ### Cómo mantuve el proyecto organizado

    Enfrentamos tres retos a la vez. El primero era mantener a todo el equipo contento y motivado, dándole trabajo que disfrutara, sobre todo porque para algunos integrantes era su primer proyecto. El segundo era que todavía estábamos aprendiendo, así que el calendario tuvo que incluir tiempo de aprendizaje. El tercero nació de los dos anteriores: el tiempo. Teníamos menos de tres meses para hacer un juego que se sintiera bien, y eso es más justo de lo que parece, así que cada semana contaba.

    Mi respuesta fue el orden, y muchas hojas de cálculo. Tareas, fechas límite y bugs vivían en hojas compartidas, cada una con una función clara, para que nadie tuviera que preguntar qué hacer después ni dónde buscar.

    - **Un solo lugar para consultar:** todos trabajaban con las mismas hojas, así que el plan nunca estaba solo en la cabeza de alguien. Aun así, en los stand-ups se hacían muchos ajustes.
    - **Bugs con historial:** el seguimiento de bugs era parte de mi trabajo, y una lista escrita facilitaba ver qué estaba abierto, qué estaba resuelto y qué seguía bloqueándonos. Muchos bugs se registraron en JIRA y Hack'n Plan.
    - **Problemas visibles a tiempo:** cuando una tarea se retrasaba, se notaba en la hoja esa misma semana, cuando todavía había tiempo de mover cosas.

    Nuestras herramientas fueron Google Sheets, JIRA y Hack'n Plan, y cada plataforma tenía sus propias fortalezas.

    *Pendiente: una línea sobre para qué servía mejor cada plataforma (para qué usaste Sheets, para qué JIRA y para qué Hack'n Plan).*

    Escribí más sobre esta forma de trabajar en mi proyecto **Gestión con hojas de cálculo**.

    ### Retos y lo que aprendí

    El calendario fue solo la mitad del reto. La otra mitad fue el lado humano: los conflictos dentro del equipo y construir un equipo que confiara entre sí. Poner las prioridades por escrito ayudó mucho. También aprendí a ser flexible y a confiar en mi equipo: a veces no conseguíamos el resultado que queríamos, pero sí uno satisfactorio o incluso mejor, y eso motivaba al equipo a trabajar todavía más.

    ### Equipo

    - **Rodrigo Alberto Galvan Alejandre**: PM, texturas, arte de entornos
    - **Mel Mirahmadi**: Arte, animaciones de personajes, VFX, diseño de UI
    - **Martin Navarro**: Diseño de niveles, diseño de sonido, QA
    - **Carson Wang**: Programación, diseño de combate

    ### Colaboradores externos

    - Maat Ramirez Morales: Arte conceptual
    - Izak Arida: Colaboración musical
    - Jon Hunwick: Arte conceptual
    - Natalia Casados: Arte de props
    - Natalie Wong: Arte de props
    - Abigail Gravill: Arte conceptual
    - Juan Destefano: Colaboración de sonido
    - Wesley Chang: Colaboración de sonido

