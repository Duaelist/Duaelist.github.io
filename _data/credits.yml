- title: "Snake Space"
  role: "PM, Environment Art, Textures, Bug Tracking and some VFX"
  year: "2026"
  image: "/assets/img/work/hd1.gif"
  banner: "/assets/img/work/snake-space-banner.jpg"   # wide image at the top of the overlay
  # Tool chips: add the ones you actually used, e.g. ["Unity", "Blender"]
  tools: []
  description: |
    Snake Space is a first-person high-risk precision shooter where you play as Dorian, a scientist partially infected by an extra-dimensional snake parasite, still fighting to maintain control. Outnumbered, one advantage is your phase shifting ability, that allows you to scout or move to a better vantage point when things get too threatening.

    **Status:** Released · **Platform:** Windows · Free to download on itch.io

    ### My role

    I was the project manager, and I also made textures and environment art. Doing both was useful on a small team: being close to the art meant I knew how long things really took, so my planning stayed honest and approachable.

    ### How I kept the project organized

    Our challenge was Triple, maintaining the entire team happy and motivated, giving them something they like to do since it was some of the team members first project, adding to that, the fact that we were still learning made it so the timeline had to be adjusted and account for learning time, finally these two combined created the additional challenge of time, since three months become pretty tight actually. We had under three months to make a game that felt good to play, so every week counted. My answer was order, and a lot of sheets. Tasks, deadlines and bugs lived in shared sheets, each with one clear job, so nobody had to ask what to do next or where to look.

    - **One place to look:** everyone worked from the same sheets, so the plan was never in somebody's head, even so, many adjustments could be made on the stand ups.
    - **Bugs with a trail:** bug tracking was part of my job, and a written list made it easy to see what was open, what was fixed and what still blocked us many of them were trackend on the platform JIRA and hack'n plan.
    - **Problems visible early:** when a task slipped, it showed in the sheet that week, while there was still time to move things around.

    Our tools include Google sheets, JIRA and hack'n plan. each platform has its strenghts

    I wrote more about this way of working in my **Managing through Sheets** project.

    ### Challenges and what I learned

    The timeline was only half of the challenge. The other half was the people side: conflicts inside the team and building a team that trusted each other. Putting priorities in writing helped a lot. It also learned to be flexible and trust my team, sometimes we didnt get the desired result but we got something satisfactory or even better and that motivated the team into working more

   

    ### Team

    - **Rodrigo Alberto Galvan Alejandre**: PM, textures, environment artist
    - **Mel Mirahmadi**: Artist, character animations, VFX, UI designer
    - **Martin Navarro**: Level designer, sound designer, QA
    - **Carson Wang**: Programmer, combat designer

    ### External collaborators

    - Maat Ramirez Morales: Concept artist
    - Izak Arida: Music collaborator
    - Jon Hunwick: Concept artist
    - Natalia Casados: Prop artist
    - Natalie Wong: Prop artist
    - Abigail Gravill: Concept artist
    - Juan Destefano: Sound collaborator
    - Wesley Chang: Sound collaborator

    No generative AI was used.
