- title: "Management and Design for TV Azteca"
  title_es: "Gestión y diseño para TV Azteca"
  role: "Manager/Designer"
  role_es: "Manager y diseñador"
  year: "2022"
  image: "/assets/img/work/tv-azteca-1.jpg"
  banner: "/assets/img/work/tv-azteca-banner.avif"
  tools: ["Ableton", "Resolume Arena", "After Effects", "Google Sheets"]
  description: |
    For TV Azteca I managed and designed visuals for screens more than 20 meters wide. No single program could do that job, so we built a hybrid system that tied together sound, live visuals and planning: Ableton for the music, After Effects to create the designs, Resolume Arena to play them on the screens, and Google Sheets to keep the whole team organized.

    The screens showed landscape visuals, advertising spaces and internal messages for the staff. We also worked on events for live shows such as *Venga la Alegría* and *Box Azteca*, as well as other special events.

    **Client:** TV Azteca · **Screen size:** 20+ meters wide

    ### My role

    I was both the manager and a designer. On a screen this size the design and the schedule can't be separated: every effect, resolution and render time has a real cost. Designing alongside the team kept my planning honest, and managing the plan meant I always knew what the designs needed next.

    ### The hybrid system

    Each program had one clear job:

    - **After Effects:** where the designs and animations were created.
    - **Resolume Arena:** where the visuals were played and controlled. Clips were organized in columns, and effects like Contour Glow turned a live camera feed into a glowing outline.
    - **Ableton:** the sound. MIDI notes drive the music, and an LFO moves the drive of a saturator in time with the tempo, so the sound pulses with the beat.
    - **Google Sheets:** the plan behind it all, with tasks, deadlines and assets in one place.

    *Placeholder: how Ableton and Resolume were connected (MIDI, audio, something else?) and how files moved from After Effects into Resolume.*

    ### How I kept the project organized

    Because of how the system worked, organizing the schedules and the notes for the materials we received was fairly dynamic and, when we got advance notice, straightforward. But in television everything is urgent and everything is already running late, so we often had to improvise: put a piece together or rearrange the schedule at the last minute. Keeping a Google Sheet with the standard schedules and backup material in case something failed was a priority and a necessity.

    ### Challenges and what I learned

    Working under pressure and experimenting with different materials to find out which ones sponsors and collaborators would like most was very useful. I also recommended to production which shots worked better and when certain things could or couldn't be done. That helped me a lot with diplomacy and team management.

    ### Team

    - **Rodrigo Alberto Galvan Alejandre**: Manager, designer
    - **Diego Chavez Chavarria**: Supervisor
  description_es: |
    Para TV Azteca gestioné y diseñé visuales para pantallas de más de 20 metros de ancho. Ningún programa por sí solo podía hacer ese trabajo, así que construimos un sistema híbrido que unía sonido, visuales en vivo y planeación: Ableton para la música, After Effects para crear los diseños, Resolume Arena para reproducirlos en las pantallas y Google Sheets para mantener organizado a todo el equipo.

    Las pantallas mostraban visuales de paisaje, espacios publicitarios y mensajes internos para los trabajadores. Además, se realizaban eventos para programas en vivo como *Venga la Alegría*, *Box Azteca* y otros eventos especiales.

    **Cliente:** TV Azteca · **Tamaño de pantalla:** más de 20 metros de ancho

    ### Mi rol

    Fui a la vez el manager y un diseñador. En una pantalla de este tamaño el diseño y el calendario no se pueden separar: cada efecto, resolución y tiempo de render tiene un costo real. Diseñar junto al equipo mantuvo mi planeación honesta, y gestionar el plan significaba que siempre sabía qué necesitaban los diseños a continuación.

    ### El sistema híbrido

    Cada programa tenía una función clara:

    - **After Effects:** donde se crearon los diseños y las animaciones.
    - **Resolume Arena:** donde se reproducían y controlaban los visuales. Los clips se organizaban en columnas, y efectos como Contour Glow convertían la imagen de una cámara en vivo en un contorno brillante.
    - **Ableton:** el sonido. Las notas MIDI llevan la música, y un LFO mueve el drive de un saturador al ritmo del tempo, de modo que el sonido pulsa con el beat.
    - **Google Sheets:** el plan detrás de todo, con tareas, fechas límite y assets en un solo lugar.

    *Pendiente: cómo se conectaron Ableton y Resolume (¿MIDI, audio, otra cosa?) y cómo pasaban los archivos de After Effects a Resolume.*

    ### Cómo mantuve el proyecto organizado

    Por la naturaleza del sistema, organizar los tiempos y las notas de los materiales que recibíamos era bastante dinámico y, cuando se avisaba con antelación, sencillo. Pero en televisión todo es urgente, todo ya va atrasado, y muchas veces tocaba improvisar: armar un material o reacomodar los horarios a último momento. Por eso, mantener una hoja de Google con los horarios estándar y material de respaldo por si algo fallaba era una prioridad y una necesidad.

    ### Retos y lo que aprendí

    Trabajar bajo presión y experimentar con distintos materiales para descubrir cuáles podían gustar más a patrocinadores y colaboradores fue muy útil. También le recomendaba a producción qué tomas funcionaban mejor y cuándo se podían (o no) hacer ciertas cosas, lo que me ayudó mucho con la diplomacia y el manejo de equipos.

    ### Equipo

    - **Rodrigo Alberto Galvan Alejandre**: Manager, diseñador
    - **Diego Chavez Chavarria**: Supervisor
