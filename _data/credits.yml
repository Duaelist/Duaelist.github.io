  description: |
    Snake Space is a first-person high-risk precision shooter where you play as Dorian, a scientist partially infected by an extra-dimensional snake parasite, still fighting to maintain control. Outnumbered, one advantage is your phase shifting ability, that allows you to scout or move to a better vantage point when things get too threatening.

    **Status:** Released · **Platform:** Windows · Free to download on itch.io

    ### My role

    I was the project manager, and I also made textures and environment art. Doing both was useful on a small team: being close to the art meant I knew how long things really took, so my planning stayed honest.

    ### How I kept the project organized

    Our biggest challenge was time. We had under three months to make a game that felt good to play, so every week counted. My answer was order, and a lot of sheets. Tasks, deadlines and bugs lived in shared sheets, each with one clear job, so nobody had to ask what to do next or where to look.

    - **One place to look:** everyone worked from the same sheets, so the plan was never in somebody's head.
    - **Bugs with a trail:** bug tracking was part of my job, and a written list made it easy to see what was open, what was fixed and what still blocked us.
    - **Problems visible early:** when a task slipped, it showed in the sheet that week, while there was still time to move things around.

    *Placeholder: name the sheets you actually used (for example schedule, bug list, asset list) and what a typical week looked like.*

    I wrote more about this way of working in my **Managing through Sheets** project.

    ### Challenges and what I learned

    The timeline was only half of the challenge. The other half was the people side: conflicts inside the team and building a team that trusted each other. Putting priorities in writing helped here too, because a disagreement about a plan is easier to solve than a disagreement about a person.

    *Placeholder: your personal thoughts. What you would do differently, and what you are proud of.*

