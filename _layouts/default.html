{% include i18n.html %}
<!DOCTYPE html>
<html lang="{{ L }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }} · {{ t.tagline | default: site.tagline }}</title>
  <meta name="description" content="{{ page.description | default: t.description | default: site.description }}">
  {% if page.lang %}
  <link rel="alternate" hreflang="en" href="{{ '/' | absolute_url }}">
  <link rel="alternate" hreflang="es" href="{{ '/es/' | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ '/' | absolute_url }}">
  {% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body{% if page.lang %} data-lang="{{ page.lang }}" data-en-url="{{ '/' | relative_url }}" data-es-url="{{ '/es/' | relative_url }}"{% endif %}>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  {% include nav.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script src="{{ '/assets/js/filter.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/background.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/credits-modal.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/lang.js' | relative_url }}"></script>
</body>
</html>
